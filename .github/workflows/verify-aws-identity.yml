name: Verify AWS deployment identity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify protected demo OIDC role
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v6
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEMO_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Prove the project-specific role and canonical API access
        env:
          ICO_STACK_NAME: IcoStack-demo
          ICO_API_DOMAIN: api.incaof.com
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$arn" == arn:aws:sts::*:assumed-role/ico-github-demo-deploy/* ]]
          ./scripts/configure-api-domain.sh
