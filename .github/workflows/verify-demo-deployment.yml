name: Verify quota-safe demo deployment

on:
  pull_request:
    branches: [main]
    types: [labeled]

concurrency:
  group: verify-demo-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy demo through scoped OIDC roles
    if: github.event.label.name == 'verify-demo-deployment' || github.event.label.name == 'deploy-hackathon-edge'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: uv sync --frozen
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEMO_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Prove the project-specific entry role
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          [[ "$arn" == arn:aws:sts::*:assumed-role/ico-github-demo-deploy/* ]]
      - name: Build exact deployable artifacts
        run: |
          ./scripts/build-lambda.sh
          ./scripts/build-agentcore-runtime.sh
      - name: Typecheck infrastructure
        run: npm --workspace @incaseof/infra run build
      - name: Deploy without replacing the quota-blocked AgentCore Runtime
        working-directory: infra/cdk
        env:
          DEPLOY_EDGE: ${{ github.event.label.name == 'deploy-hackathon-edge' }}
        run: |
          edge_context=(-c skipEdgeHosting=true)
          if [[ "$DEPLOY_EDGE" == "true" ]]; then
            api_regional_name="$(aws apigatewayv2 get-domain-name --domain-name api.incaof.com --query DomainNameConfigurations[0].ApiGatewayDomainName --output text)"
            api_hosted_zone="$(aws apigatewayv2 get-domain-name --domain-name api.incaof.com --query DomainNameConfigurations[0].HostedZoneId --output text)"
            edge_context=(
              -c existingApiDomainRegionalName="$api_regional_name"
              -c existingApiDomainHostedZoneId="$api_hosted_zone"
            )
          fi
          npx cdk deploy IcoStack-demo \
            --require-approval never \
            -c env=demo \
            "${edge_context[@]}" \
            -c preserveDeployedAgentCoreRuntime=true \
            -c 'preservedAgentCoreArtifactBucketTemplate=cdk-hnb659fds-assets-${AWS::AccountId}-us-east-1' \
            -c preservedAgentCoreArtifactKey=d1aafd64894e6f1d4142c58e31bf0218f8880503d2b73237b793543f3b744adf.zip \
            -c preservedAgentCoreModelId=us.anthropic.claude-sonnet-4-6 \
            -c hostedZoneId=${{ vars.ICO_HOSTED_ZONE_ID }} \
            -c hostedZoneName=incaof.com \
            -c pushPlatformArn=${{ vars.ICO_FCM_PLATFORM_ARN }}
      - name: Prove CloudFormation used the scoped executor
        run: |
          role="$(aws cloudformation describe-stacks --stack-name IcoStack-demo --query 'Stacks[0].RoleARN' --output text)"
          [[ "$role" == arn:aws:iam::*:role/ico-demo-cfn-exec ]]
      - name: Verify canonical API after deployment
        env:
          ICO_STACK_NAME: IcoStack-demo
          ICO_API_DOMAIN: api.incaof.com
        run: ./scripts/configure-api-domain.sh
      - name: Set up Java for the signed Android artifact
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Build and verify signed Android demo
        env:
          ICO_ANDROID_KEYSTORE_B64: ${{ secrets.ICO_ANDROID_KEYSTORE_B64 }}
          ICO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ICO_ANDROID_KEYSTORE_PASSWORD }}
          ICO_ANDROID_KEY_ALIAS: ${{ secrets.ICO_ANDROID_KEY_ALIAS }}
          ICO_ANDROID_KEY_PASSWORD: ${{ secrets.ICO_ANDROID_KEY_PASSWORD }}
          ICO_FIREBASE_GOOGLE_SERVICES_B64: ${{ secrets.ICO_FIREBASE_GOOGLE_SERVICES_B64 }}
        run: |
          secure_dir="$RUNNER_TEMP/ico-android"
          mkdir -p "$secure_dir" apps/marketing/public/downloads
          chmod 700 "$secure_dir"
          printf '%s' "$ICO_ANDROID_KEYSTORE_B64" | base64 --decode > "$secure_dir/ico-release.jks"
          printf '%s' "$ICO_FIREBASE_GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
          chmod 600 "$secure_dir/ico-release.jks" android/app/google-services.json
          env \
            ICO_ANDROID_KEYSTORE_PATH="$secure_dir/ico-release.jks" \
            ICO_ANDROID_KEYSTORE_PASSWORD="$ICO_ANDROID_KEYSTORE_PASSWORD" \
            ICO_ANDROID_KEY_ALIAS="$ICO_ANDROID_KEY_ALIAS" \
            ICO_ANDROID_KEY_PASSWORD="$ICO_ANDROID_KEY_PASSWORD" \
            ./android/gradlew -p android --no-build-cache --no-configuration-cache \
              assembleRelease lintRelease ktlintCheck \
              -Pico.apiBaseUrl=https://api.incaof.com/ \
              -Pico.cognitoPoolId=${{ vars.ICO_COGNITO_POOL_ID }} \
              -Pico.cognitoClientId=${{ vars.ICO_COGNITO_CLIENT_ID }} \
              -Pico.cognitoRegion=us-east-1
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='com.incaof.app'"
          install -m 0644 "$apk" apps/marketing/public/downloads/in-case-of.apk
          (cd apps/marketing/public/downloads && sha256sum in-case-of.apk > in-case-of.apk.sha256)
          npm --workspace @incaseof/marketing run assets:qr
      - name: Publish static clients through the new edge
        if: github.event.label.name == 'deploy-hackathon-edge'
        env:
          ICO_STACK_NAME: IcoStack-demo
          ICO_PUBLIC_API_URL: https://api.incaof.com
        run: ./scripts/deploy-web.sh
      - name: Retain signed APK for release evidence
        uses: actions/upload-artifact@v7
        with:
          name: in-case-of-android-demo
          path: |
            apps/marketing/public/downloads/in-case-of.apk
            apps/marketing/public/downloads/in-case-of.apk.sha256
          if-no-files-found: error
          retention-days: 30
