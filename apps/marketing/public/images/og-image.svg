    <text x="0" y="158" font-size="30" font-weight="400" fill="#c9cec9">Monitor the plan, not the person.</text>
  </g>

  <line x1="112" y1="405" x2="1088" y2="405" stroke="#555c57" stroke-width="2"/>
  <circle cx="194" cy="405" r="8" fill="#9dc9b5"/>
  <circle cx="582" cy="405" r="8" fill="#e85b2a"/>
  <circle cx="1006" cy="405" r="8" fill="#9dc9b5"/>
  <g fill="#c9cec9" font-family="IBM Plex Mono, monospace" font-size="18" letter-spacing="1">
