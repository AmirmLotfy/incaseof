<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">In Case Of — Someone notices</title>
  <desc id="description">The ICO lettermark and the promise to monitor the plan, not the person.</desc>
  <defs>
