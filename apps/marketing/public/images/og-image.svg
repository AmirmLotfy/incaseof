    <rect x="32" y="62" width="17" height="66" rx="5" fill="#f6f5f0"/>
    <path d="M101 68 C78 68 62 80 62 95 C62 110 78 122 101 122" fill="none" stroke="#f6f5f0" stroke-width="15" stroke-linecap="round"/>
    <circle cx="143" cy="95" r="31" fill="none" stroke="#f6f5f0" stroke-width="15"/>
    <circle cx="143" cy="95" r="11" fill="#e85b2a"/>
    <circle cx="143" cy="95" r="32" fill="url(#signal)"/>
  </g>

  <g transform="translate(354 106)" fill="#f6f5f0" font-family="Public Sans, Arial, sans-serif">
