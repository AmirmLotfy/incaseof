      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#303532" stroke-width="1" opacity="0.48"/>
    </pattern>
    <radialGradient id="signal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8055" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e85b2a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#111412"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="62" y="58" width="1076" height="514" rx="24" fill="#171a18" stroke="#3d433f"/>

  <g transform="translate(112 104)">
