openapi: 3.1.0
info:
  title: In Case of API
  version: 0.1.0
  license:
    name: Apache-2.0
  description: |
    In Case of does not decide whether someone is in danger. It notices unresolved
    expectations and works to close the loop.

    Two authentication realms:
      * /v1/*  Cognito-authenticated principal.
      * /r/* and /i/*  signed, narrowly scoped tokens. Never a broad session.
      * /v1/demo/*  a short-lived synthetic-tenant token, demo environment only.

    No endpoint ever returns a plaintext phone number.

servers:
  - url: https://api.incaof.com

tags:
  - name: service
  - name: plans
  - name: moments
  - name: circle
  - name: alerts
  - name: responder
  - name: devices
  - name: demo

paths:
  /:
    get:
      tags: [service]
      summary: Describe the public API without exposing tenant data
      security: []
      responses:
        "200":
          description: API descriptor
          content:
            application/json:
              schema:
                type: object
                required: [service, status, productBoundary]
                properties:
                  service: { const: "In Case Of API" }
                  status: { const: "ok" }
                  productBoundary: { type: string }

  /v1/plans/compile:
    post:
      tags: [plans]
      summary: Compile natural language into a validated CompiledPlan
      description: |
        Preview only. This endpoint NEVER creates or activates anything. Activation is a
        separate explicit call, because a plan that took effect the moment it was
        described would remove the human confirmation step that the safety model depends on.
      security: [{ cognito: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utterance]
              properties:
                utterance: { type: string, minLength: 1, maxLength: 2000 }
                timezone: { type: string }
      responses:
        "200":
          description: Compiled plan for human preview
          content:
            application/json:
              schema:
                type: object
                required: [active, requiresConfirmation, compiledPlan, plan, warnings, trace]
                properties:
                  active: { const: false }
                  requiresConfirmation: { const: true }
                  compiledPlan:
                    $ref: "../domain-schemas/compiled-plan.schema.json"
                  plan: { type: object }
                  warnings: { type: array, items: { type: string } }
                  trace: { type: object }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/plans:
    get:
      tags: [plans]
      summary: List plans
      security: [{ cognito: [] }]
      responses: { "200": { description: OK } }
    post:
      tags: [plans]
      summary: Create a plan from a compiled plan
      security: [{ cognito: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../domain-schemas/compiled-plan.schema.json"
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/plans/{planId}:
    get:
      tags: [plans]
      summary: Get a plan
      security: [{ cognito: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Problem" } }

  /v1/history:
    get:
      tags: [alerts]
      summary: List the authenticated subject's terminal Alerts as truthful history
      security: [{ cognito: [] }]
      responses: { "200": { description: OK } }

  /v1/plans/{planId}/activate:
    post:
      tags: [plans]
      summary: Activate a plan, creating an immutable PlanVersion
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Activated } }

  /v1/plans/{planId}/pause:
    post:
      tags: [plans]
      summary: Pause a plan
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Paused } }

  /v1/plans/{planId}/resume:
    post:
      tags: [plans]
      summary: Resume a plan
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Resumed } }

  /v1/plans/{planId}/test:
    post:
      tags: [plans]
      summary: Drill Mode — run the real workflow on a compressed schedule
      description: Uses the production workflow engine. There is no demo-only code path.
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "202": { description: Drill started } }

  /v1/moments/next:
    get:
      tags: [moments]
      summary: The next Expected Moment
      security: [{ cognito: [] }]
      responses: { "200": { description: OK } }

  /v1/moments/{momentId}:
    get:
      tags: [moments]
      summary: Get a Moment
      security: [{ cognito: [] }]
      parameters: [{ $ref: "#/components/parameters/MomentId" }]
      responses: { "200": { description: OK } }

  /v1/moments/{momentId}/confirm:
    post:
      tags: [moments]
      summary: 'I''m okay — subject confirmation'
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Resolved } }

  /v1/moments/{momentId}/extend:
    post:
      tags: [moments]
      summary: Extend this Moment only
      description: Affects tonight alone. It never mutates the recurring plan.
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Extended } }

  /v1/moments/{momentId}/cancel:
    post:
      tags: [moments]
      summary: Cancel a Moment before escalation
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Cancelled } }

  /v1/circle:
    get:
      tags: [circle]
      summary: List Circle members
      security: [{ cognito: [] }]
      responses: { "200": { description: OK } }

  /v1/circle/invitations:
    post:
      tags: [circle]
      summary: Invite someone to a Circle
      description: Nobody becomes a safety contact without explicit acceptance.
      security: [{ cognito: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "201": { description: Invited } }

  /v1/circle/invitations/{invitationId}/resend:
    post:
      tags: [circle]
      summary: Resend an invitation
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Resent } }

  /v1/circle/members/{memberId}:
    delete:
      tags: [circle]
      summary: Remove a Circle member
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/MemberId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "204": { description: Removed } }

  /i/{signedToken}:
    get:
      tags: [circle]
      summary: Read a Circle invitation without creating an account
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: Invitation }, "403": { $ref: "#/components/responses/Problem" } }

  /v1/i/{signedToken}/accept:
    post:
      tags: [circle]
      summary: Accept a Circle invitation and its scoped plan consent
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: Accepted }, "409": { $ref: "#/components/responses/Problem" } }

  /v1/i/{signedToken}/decline:
    post:
      tags: [circle]
      summary: Decline a Circle invitation
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: Declined }, "409": { $ref: "#/components/responses/Problem" } }

  /v1/devices:
    post:
      tags: [devices]
      summary: Register an FCM device for the authenticated subject
      security: [{ cognito: [] }]
      responses: { "201": { description: Registered }, "503": { $ref: "#/components/responses/Problem" } }

  /v1/devices/{deviceId}:
    delete:
      tags: [devices]
      summary: Remove one of the authenticated subject's devices
      security: [{ cognito: [] }]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      responses: { "204": { description: Removed } }

  /v1/alerts/{alertId}:
    get:
      tags: [alerts]
      summary: Get an Alert
      security: [{ cognito: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      responses: { "200": { description: OK } }

  /v1/alerts/{alertId}/claim:
    post:
      tags: [alerts]
      summary: Claim an Alert — starts the checking lease
      description: |
        Claiming pauses backup escalation for the lease duration. It does NOT mean the
        subject is safe. Acknowledged is not resolved.
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Claimed }
        "409": { $ref: "#/components/responses/Problem" }

  /v1/alerts/{alertId}/release:
    post:
      tags: [alerts]
      summary: Release a claim — escalation resumes immediately
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Released } }

  /v1/alerts/{alertId}/resolve:
    post:
      tags: [alerts]
      summary: Resolve an Alert
      security: [{ cognito: [] }]
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Resolved } }

  /v1/alerts/{alertId}/timeline:
    get:
      tags: [alerts]
      summary: Full audit timeline
      security: [{ cognito: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      responses: { "200": { description: OK } }

  /v1/demo/session:
    post:
      tags: [demo]
      summary: Start an isolated synthetic judge session (demo stack only)
      security: []
      responses: { "201": { description: Short-lived demo session issued } }

  /v1/demo/plans/compile:
    post:
      tags: [demo]
      summary: Compile a plan inside the synthetic judge tenant
      security: []
      responses: { "200": { description: Preview }, "403": { $ref: "#/components/responses/Problem" } }

  /v1/demo/plans:
    get:
      tags: [demo]
      summary: List plans inside the synthetic judge tenant
      security: []
      responses: { "200": { description: OK } }
    post:
      tags: [demo]
      summary: Create a draft inside the synthetic judge tenant
      security: []
      responses: { "201": { description: Created } }

  /v1/demo/plans/{planId}:
    get:
      tags: [demo]
      summary: Get a plan inside the synthetic judge tenant
      security: []
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses: { "200": { description: OK } }

  /v1/demo/plans/{planId}/activate:
    post:
      tags: [demo]
      summary: Activate a consented synthetic judge plan
      security: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Activated } }

  /v1/demo/plans/{planId}/pause:
    post:
      tags: [demo]
      summary: Pause a synthetic judge plan
      security: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Paused } }

  /v1/demo/plans/{planId}/resume:
    post:
      tags: [demo]
      summary: Resume a synthetic judge plan
      security: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Resumed } }

  /v1/demo/plans/{planId}/test:
    post:
      tags: [demo]
      summary: Start a real accelerated Drill for the synthetic judge tenant
      security: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "202": { description: Drill started } }

  /v1/demo/moments/next:
    get:
      tags: [demo]
      summary: Get the synthetic judge tenant's next Moment
      security: []
      responses: { "200": { description: OK } }

  /v1/demo/moments/{momentId}/confirm:
    post:
      tags: [demo]
      summary: Confirm the synthetic judge Moment
      security: []
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Confirmed } }

  /v1/demo/moments/{momentId}/extend:
    post:
      tags: [demo]
      summary: Extend the synthetic judge Moment
      security: []
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Extended } }

  /v1/demo/circle:
    get:
      tags: [demo]
      summary: List accepted synthetic Circle roles
      security: []
      responses: { "200": { description: OK } }

  /v1/demo/circle/invitations:
    post:
      tags: [demo]
      summary: Create a synthetic Circle invitation
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "201": { description: Invitation created } }

  /v1/demo/history:
    get:
      tags: [demo]
      summary: List the synthetic judge tenant's resolved Moments
      security: []
      responses: { "200": { description: OK } }

  /v1/demo/alerts/{alertId}:
    get:
      tags: [demo]
      summary: Get the synthetic judge tenant's Alert
      security: []
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      responses: { "200": { description: OK } }

  /v1/demo/alerts/{alertId}/claim:
    post:
      tags: [demo]
      summary: Claim a synthetic judge Alert
      security: []
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "200": { description: Claimed } }

  /v1/demo/alerts/{alertId}/timeline:
    get:
      tags: [demo]
      summary: Get the real audit timeline for the synthetic judge tenant
      security: []
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      responses: { "200": { description: OK } }

  /v1/demo/alerts/{alertId}/responder-link:
    get:
      tags: [demo]
      summary: Mint a synthetic responder link for the current demo Alert
      security: []
      parameters: [{ $ref: "#/components/parameters/AlertId" }]
      responses: { "200": { description: Narrow single-Alert responder URL } }

  /r/{signedToken}:
    get:
      tags: [responder]
      summary: Incident Room — no account required
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: HTML Incident Room }, "410": { $ref: "#/components/responses/Problem" } }

  /v1/r/{signedToken}/claim:
    post:
      tags: [responder]
      summary: Responder claims the Alert
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: Claimed } }

  /v1/r/{signedToken}/extend:
    post:
      tags: [responder]
      summary: Extend the checking lease
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: Extended } }

  /v1/r/{signedToken}/unable:
    post:
      tags: [responder]
      summary: 'I couldn''t reach them — escalation resumes'
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: Escalation resumed } }

  /v1/r/{signedToken}/resolve:
    post:
      tags: [responder]
      summary: 'I reached them — they''re okay'
      security: []
      parameters: [{ $ref: "#/components/parameters/SignedToken" }]
      responses: { "200": { description: Resolved } }

components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PlanId: { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    MomentId: { name: momentId, in: path, required: true, schema: { type: string, format: uuid } }
    AlertId: { name: alertId, in: path, required: true, schema: { type: string, format: uuid } }
    MemberId: { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceId: { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    SignedToken: { name: signedToken, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Replays return the original result rather than acting twice.
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              reason_code:
                type: string
                description: Stable machine code. Never leaks another user's data.
